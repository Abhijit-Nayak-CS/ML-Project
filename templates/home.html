<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Indicator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .login {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .main-title {
            text-align: center;
            color: #2d3748;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-title {
            color: #4a5568;
            font-size: 21px;
            margin-bottom: 25px;
            text-align: center;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f0f4ff;
            border-left: 5px solid #667eea;
            border-radius: 10px;
            text-align: center;
            color: #2d3748;
            font-size: 18px;
            font-weight: bold;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #718096;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .login {
                padding: 25px 20px;
            }

            .main-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login">

            <h1 class="main-title">
                🎓 Student Exam Performance
            </h1>

            <p class="subtitle">
                Predict the student's Mathematics score using Machine Learning
            </p>

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <h2 class="form-title">
                    Student Information
                </h2>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select class="form-control" name="gender" required>
                        <option selected disabled value="">
                            Select your Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>
                    </select>
                </div>


                <!-- Race / Ethnicity -->
                <div class="mb-3">
                    <label class="form-label">
                        Race or Ethnicity
                    </label>

                    <select class="form-control" name="ethnicity" required>
                        <option selected disabled value="">
                            Select Ethnicity
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>


                <!-- Parental Education -->
                <div class="mb-3">
                    <label class="form-label">
                        Parental Level of Education
                    </label>

                    <select class="form-control"
                            name="parental_level_of_education"
                            required>

                        <option selected disabled value="">
                            Select Parent Education
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                    </select>
                </div>


                <!-- Lunch -->
                <div class="mb-3">
                    <label class="form-label">
                        Lunch Type
                    </label>

                    <select class="form-control"
                            name="lunch"
                            required>

                        <option selected disabled value="">
                            Select Lunch Type
                        </option>

                        <option value="free/reduced">
                            Free / Reduced
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                    </select>
                </div>


                <!-- Test Preparation -->
                <div class="mb-3">
                    <label class="form-label">
                        Test Preparation Course
                    </label>

                    <select class="form-control"
                            name="test_preparation_course"
                            required>

                        <option selected disabled value="">
                            Select Test Preparation
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>
                </div>


                <!-- Reading Score -->
                <div class="mb-3">
                    <label class="form-label">
                        Reading Score (0 - 100)
                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="reading_score"
                        placeholder="Enter Reading Score"
                        min="0"
                        max="100"
                        required>
                </div>


                <!-- Writing Score -->
                <div class="mb-3">
                    <label class="form-label">
                        Writing Score (0 - 100)
                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="writing_score"
                        placeholder="Enter Writing Score"
                        min="0"
                        max="100"
                        required>
                </div>


                <!-- Submit -->
                <div class="mb-3">

                    <input
                        class="btn"
                        type="submit"
                        value="🔮 Predict My Maths Score">

                </div>

            </form>


            <!-- Prediction Result -->

            {% if results is not none %}
            <div class="result">

                📊 Prediction Result

                <br><br>

                Your predicted Maths Score is:

                <strong>{{ results }}</strong>

            </div>
            {% endif %}


            <p class="info">
                🤖 Powered by Machine Learning
            </p>

        </div>

    </div>

</body>

</html>
